frontend:
  appName: frontend-app


  image_name: registry.gitlab.com/mahmoudkhera20/microservice-devops/frontend
  image_tag: latest
  
  serviceName: frontend
  containerPort: 8000
  service:
    port_name: frontend-port
    # ClusterIP for internal, NodePort for Minikube external access, LoadBalancer for cloud
    type: ClusterIP
    port: 8000              # Port other services hit (e.g., http://frontend:80)
    targetPort: 8000       # Port your container actually listens on
    #nodePort: 30080     # Only used when type=NodePort; omit to let k8s pick (30000-32767)
  configmap:
    name: frontend
    data:
      HOST: '0.0.0.0'
      PORT: '8000'
      API: "http://frontend.192.168.49.2.nip.io/backend"