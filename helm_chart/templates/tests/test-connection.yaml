{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "stockwatch.fullname" . }}-test-connection
  namespace: {{ include "stockwatch.namespace" . }}
  labels:
    {{- include "stockwatch.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -e
          {{- if .Values.frontend.enabled }}
          echo "--- frontend {{ .Values.tests.frontendPath }}"
          curl -sSf --max-time 10 "http://{{ .Values.frontend.name }}:{{ .Values.frontend.service.port }}{{ .Values.tests.frontendPath }}" > /dev/null
          {{- end }}
          {{- if .Values.inventory.enabled }}
          echo "--- inventory {{ .Values.tests.inventoryPath }}"
          curl -sSf --max-time 10 "http://{{ .Values.inventory.name }}:{{ .Values.inventory.service.port }}{{ .Values.tests.inventoryPath }}" > /dev/null
          {{- end }}
          echo "all services reachable"
{{- end }}
