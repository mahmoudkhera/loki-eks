{{- if .Values.ingress.enabled }}
{{- $ing := .Values.ingress }}
{{- if not (has $ing.controller (list "alb" "nginx")) }}
{{- fail (printf "ingress.controller must be \"alb\" or \"nginx\", got %q" $ing.controller) }}
{{- end }}
{{- if not (or .Values.frontend.enabled .Values.inventory.enabled) }}
{{- fail "ingress.enabled is true but neither frontend nor inventory is enabled" }}
{{- end }}
{{- $cfg := index $ing $ing.controller }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $ing.name | default (include "stockwatch.fullname" .) }}
  namespace: {{ include "stockwatch.namespace" . }}
  labels:
    name: .Values.ingress.name
    {{- include "stockwatch.labels" . | nindent 4 }}
  annotations:
  {{- if eq $ing.controller "alb" }}
    alb.ingress.kubernetes.io/scheme: {{ $cfg.scheme }}
    alb.ingress.kubernetes.io/target-type: {{ $cfg.targetType }}
    alb.ingress.kubernetes.io/listen-ports: {{ $cfg.listenPorts | quote }}
    alb.ingress.kubernetes.io/healthcheck-path: {{ $cfg.healthcheckPath }}
    {{- with $cfg.groupName }}
    alb.ingress.kubernetes.io/group.name: {{ . }}
    {{- end }}
  {{- else if eq $ing.controller "nginx" }}
    nginx.ingress.kubernetes.io/ssl-redirect: {{ $cfg.sslRedirect | quote }}
    nginx.ingress.kubernetes.io/use-regex: {{ $cfg.useRegex | quote }}
    {{- with $cfg.rewriteTarget }}
    nginx.ingress.kubernetes.io/rewrite-target: {{ . }}
    {{- end }}
  {{- end }}
  {{- with $cfg.extraAnnotations }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ $cfg.className }}
  rules:
    - http:
        paths:
          {{- if .Values.inventory.enabled }}
          - path: {{ $ing.backendPath }}
            pathType: {{ $cfg.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ .Values.inventory.name }}
                port:
                  name: http
          {{- end }}
          {{- if .Values.frontend.enabled }}
          - path: {{ $ing.frontendPath }}
            pathType: {{ $cfg.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ .Values.frontend.name }}
                port:
                  name: http
          {{- end }}
      {{- with $ing.host }}
      host: {{ . | quote }}
      {{- end }}
{{- end }}