---
# Source: logging/templates/fluent-bit-daemonset.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: logging
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: logging-0.1.0
    app: fluent-bit
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/instance: logging
spec:
  selector:
    matchLabels:
      app: fluent-bit
      app.kubernetes.io/name: fluent-bit
      app.kubernetes.io/instance: logging
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: logging
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: logging-0.1.0
        app: fluent-bit
        app.kubernetes.io/name: fluent-bit
        app.kubernetes.io/instance: logging
      annotations:
        checksum/config: 1476a9770bbb8a91862cfe20f6fa31ce990263a95748d6bab4b85ead769969d7
    spec:
      serviceAccountName: fluent-bit
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: fluent-bit
          image: "fluent/fluent-bit:3.2.10"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["DAC_READ_SEARCH"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 2020
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
            - name: config
              mountPath: /fluent-bit/etc/parsers.conf
              subPath: parsers.conf
            # /var/log/containers holds symlinks into /var/log/pods, so the
            # whole tree has to be mounted for the tail input to resolve them.
            - name: varlog
              mountPath: /var/log
            - name: positions
              mountPath: /var/log/fluent-bit
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: fluent-bit
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        - name: positions
          hostPath:
            path: /var/log/fluent-bit
            type: DirectoryOrCreate
      tolerations:
        - operator: Exists
