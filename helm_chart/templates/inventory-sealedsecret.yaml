{{- if .Values.inventory.enabled }}
{{- with .Values.inventory.sealedSecret }}
{{- if .enabled }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .name }}
  namespace: {{ include "stockwatch.namespace" $ }}
  labels:
    {{- include "stockwatch.labels" $ | nindent 4 }}
    {{- include "inventory.selectorLabels" $ | nindent 4 }}
  {{- if .clusterWide }}
  annotations:
    # Only valid if the ciphertext was produced with --scope cluster-wide.
    sealedsecrets.bitnami.com/cluster-wide: "true"
  {{- end }}
spec:
  encryptedData:
    {{- range $key, $value := .encryptedData }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  # Shape of the Secret the controller unseals this into. name and namespace
  # must match the SealedSecret above.
  template:
    metadata:
      name: {{ .name }}
      namespace: {{ include "stockwatch.namespace" $ }}
      labels:
        {{- include "stockwatch.labels" $ | nindent 8 }}
        {{- include "inventory.selectorLabels" $ | nindent 8 }}
    type: Opaque
{{- end }}
{{- end }}
{{- end }}
