{{- if .Values.fluentBit.enabled }}
{{- if .Values.fluentBit.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.fluentBit.serviceAccount.name }}
  namespace: {{ include "logging.namespace" . }}
  labels:
    {{- include "logging.labels" . | nindent 4 }}
    {{- include "fluentBit.selectorLabels" . | nindent 4 }}
{{- end }}
{{- if .Values.fluentBit.rbac.create }}
---
# The kubernetes filter enriches each record by looking the pod up in the API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.fluentBit.name }}-{{ include "logging.namespace" . }}
  labels:
    {{- include "logging.labels" . | nindent 4 }}
    {{- include "fluentBit.selectorLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.fluentBit.name }}-{{ include "logging.namespace" . }}
  labels:
    {{- include "logging.labels" . | nindent 4 }}
    {{- include "fluentBit.selectorLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.fluentBit.name }}-{{ include "logging.namespace" . }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.fluentBit.serviceAccount.name }}
    namespace: {{ include "logging.namespace" . }}
{{- end }}
{{- end }}
