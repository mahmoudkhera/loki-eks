{{- if and .Values.grafana.enabled (not .Values.grafana.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grafana.secretName" . }}
  namespace: {{ include "logging.namespace" . }}
  labels:
    {{- include "logging.labels" . | nindent 4 }}
    {{- include "grafana.selectorLabels" . | nindent 4 }}
type: Opaque
data:
  admin-user: {{ .Values.grafana.adminUser | b64enc | quote }}
  admin-password: {{ required "grafana.adminPassword is required unless grafana.existingSecret is set" .Values.grafana.adminPassword | b64enc | quote }}
{{- end }}
