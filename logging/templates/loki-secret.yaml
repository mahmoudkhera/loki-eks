{{- if and .Values.loki.enabled (eq .Values.loki.storage.type "s3") .Values.loki.storage.s3.accessKeyId }}
# Static credentials, for S3-compatible stores that cannot use IRSA (MinIO and
# friends). On EKS leave these empty and annotate the service account instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.loki.name }}-s3
  namespace: {{ include "logging.namespace" . }}
  labels:
    {{- include "logging.labels" . | nindent 4 }}
    {{- include "loki.selectorLabels" . | nindent 4 }}
type: Opaque
data:
  AWS_ACCESS_KEY_ID: {{ .Values.loki.storage.s3.accessKeyId | b64enc | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "loki.storage.s3.secretAccessKey is required when accessKeyId is set" .Values.loki.storage.s3.secretAccessKey | b64enc | quote }}
{{- end }}
