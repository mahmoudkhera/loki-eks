{{- if .Values.loki.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.loki.name }}
  namespace: {{ include "logging.namespace" . }}
  labels:
    {{- include "logging.labels" . | nindent 4 }}
    {{- include "loki.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.loki.replicas }}
  serviceName: {{ .Values.loki.name }}-headless
  selector:
    matchLabels:
      {{- include "loki.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "logging.labels" . | nindent 8 }}
        {{- include "loki.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pod whenever the config changes.
        checksum/config: {{ include (print $.Template.BasePath "/loki-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.loki.serviceAccount.name }}
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: loki
          image: "{{ .Values.loki.image.repository }}:{{ .Values.loki.image.tag }}"
          imagePullPolicy: {{ .Values.loki.image.pullPolicy }}
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - name: http
              containerPort: {{ .Values.loki.service.httpPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.loki.service.grpcPort }}
              protocol: TCP
          {{- if and (eq .Values.loki.storage.type "s3") .Values.loki.storage.s3.accessKeyId }}
          envFrom:
            - secretRef:
                name: {{ .Values.loki.name }}-s3
          {{- end }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            {{- toYaml .Values.loki.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: storage
              mountPath: /var/loki
      volumes:
        - name: config
          configMap:
            name: {{ .Values.loki.name }}
        {{- if not .Values.loki.persistence.enabled }}
        # No PVC: chunks live in S3, and the local dir is only index/WAL scratch.
        - name: storage
          emptyDir: {}
        {{- end }}
      {{- with .Values.loki.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.loki.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---

{{- if .Values.loki.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.loki.persistence.storageClass }}
        storageClassName: {{ .Values.loki.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.loki.persistence.size }}
  {{- end }}
{{- end }}
